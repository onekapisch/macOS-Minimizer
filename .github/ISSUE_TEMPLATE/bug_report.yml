name: Bug report
description: Report a reproducible problem in Minimizer.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Open ...
        2. Press ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "Example: macOS 15.5"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Minimizer version or commit
      placeholder: "Example: v1.0.0 or commit SHA"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add screenshots, screen recordings, or affected apps if useful.
    validations:
      required: false
